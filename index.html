            pointer-events: none;
            z-index: -1;
        }

            background: #000;

        /* hamburger - pure css */
        .hamburger-wrap {
            display: none;

        }

            display: none;
        }

            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border: 3px solid #fff;
            background: #000;
        }
        .hamburger span {
            display: block;
            width: 32px;
            height: 4px;
            background: #fff;
            transition: 0.2s;
        }
        #menu-toggle:checked + .hamburger span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        #menu-toggle:checked + .hamburger span:nth-child(2) { opacity: 0; }
        #menu-toggle:checked + .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        .mobile-nav {
            display: none;
            position: absolute;
            top: 70px;
            right: 0;
            background: #000;
            border: 4px solid #ff3b00;
            padding: 32px;
            flex-direction: column;
            gap: 24px;
            min-width: 240px;
        }
        .mobile-nav a {
            font-size: 1.5rem;
        }

        #menu-toggle:checked ~ .mobile-nav {
            display: flex;
        }

            transform: rotate(var(--rot, 0deg));
        }
        .review-card:nth-child(odd) { --rot: -2deg; }
        .review-card:nth-child(even) { --rot: 1.5deg; }
        .review-card:hover {
            transform: rotate(0deg) scale(1.02);
            box-shadow: 12px 12px 0 #ff3b00;
        }

        /* RESPONSIVE */

            .review-card { transform: none !important; }

            .info-block { padding: 24px; }
            footer { flex-direction: column; text-align: center; padding: 32px 24px; }

            .skew-block { transform: none; }

            .rotated-badge { transform: none; }

            .logo { font-size: 1.8rem; }

        @media (max-width: 480px) {
